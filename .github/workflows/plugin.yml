name: Plugin

on:
  push:
    paths: ['tastywaves/**', 'Cargo.toml', 'Cargo.lock', 'xtask/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques graphiques (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxcb-glx0-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (son identique au banc, instances isolées)
        run: cargo test -p tastywaves --release
      - name: Paquets VST3 et CLAP
        run: cargo xtask bundle tastywaves --release
      - name: pluginval niveau 5 (Linux, sans les tests d'interface : l'écran virtuel plante dans pluginval lui-même)
        if: runner.os == 'Linux'
        run: |
          curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -qo pv.zip && chmod +x pluginval
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests target/bundled/tastywaves.vst3
      - name: pluginval niveau 5 (Windows, interface comprise)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -qo pv.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process target/bundled/tastywaves.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: tastywaves-${{ matrix.os }}
          path: target/bundled/*
