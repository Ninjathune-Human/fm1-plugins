name: Plugin

on:
  push:
    paths: ['tastywaves/**', 'Cargo.toml', 'Cargo.lock', 'xtask/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques graphiques (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxcb-glx0-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (son identique au banc, instances isolées)
        run: cargo test -p tastywaves --release
      - name: Paquets VST3 et CLAP
        run: cargo xtask bundle tastywaves --release
      - uses: actions/upload-artifact@v4
        with:
          name: tastywaves-${{ matrix.os }}
          path: target/bundled/*
